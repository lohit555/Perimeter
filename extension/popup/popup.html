<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Perimeter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="brand">
      <span class="brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.5L20 6V11.5C20 16.5 16.6 20.6 12 21.9C7.4 20.6 4 16.5 4 11.5V6L12 2.5Z"
                stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M8.8 12L11 14.2L15.2 10" stroke="#ffffff" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name">Perimeter</span>
      <span class="brand-sub">Token isolation</span>
    </header>

    <main id="app" class="content">
      <!-- populated by popup.js -->
    </main>

    <footer class="footer">
      <span class="count-pill" id="ledger-count">—</span>
      <a href="#" id="open-dashboard">Open dashboard →</a>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
